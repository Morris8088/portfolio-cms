<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morris · 作品集</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f7f5f1;
        color: #2c3533;
      }
      .box {
        text-align: center;
        padding: 24px;
        max-width: 520px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.8;
        color: #6b7875;
        margin: 0 0 18px;
      }
      a {
        display: inline-block;
        padding: 9px 20px;
        border-radius: 9px;
        background: #1f6f5c;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }
      code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12.5px;
        background: rgba(31, 111, 92, 0.09);
        color: #17594a;
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>正在跳转…</h1>
      <p>这个站点用的是前端路由，地址里需要带上 <code>#</code>。正在为你自动纠正。</p>
      <a id="manual" href="#">点这里手动进入</a>
    </div>

    <script>
      // ============================================================
      // GitHub Pages 的 SPA 兜底页
      // ------------------------------------------------------------
      // Pages 是纯静态托管：访问 /portfolio-cms/projects 时会去找一个
      // 叫 "projects" 的文件，找不到就返回 404.html（也就是本文件）。
      //
      // 这里把用户想要的路径搬到 # 后面，再跳回正常入口。
      // 例：/portfolio-cms/projects?x=1
      //   → /portfolio-cms/#/projects?x=1
      //
      // 路径前缀从 Pages 的仓库名推导，不写死，换仓库名也不用改。
      // ============================================================
      (function () {
        var path = decodeURIComponent(location.pathname);
        var search = location.search || '';

        // GitHub Pages 项目站点的路径形如 /<repo>/<route...>，
        // 取第一段作为 base。用户站（<user>.github.io）则直接是 /<route...>。
        var segments = path.split('/').filter(Boolean);
        var base;
        if (location.hostname.endsWith('github.io')) {
          base = segments.length && location.hostname !== 'github.io'
            ? '/' + segments[0] + '/'
            : '/';
        } else {
          base = '/';
        }

        var rest = path.slice(base.length - 1).replace(/^\/+/, '');

        var target = base + '#' + (rest ? '/' + rest : '/') + search;

        document.getElementById('manual').setAttribute('href', target);
        location.replace(target);
      })();
    </script>
  </body>
</html>

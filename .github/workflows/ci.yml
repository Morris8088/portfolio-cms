name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个分支连推多次时，取消上一次还在跑的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 接口测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # 测试用 :memory: 内存库，不落盘，所以 CI 里没有 data.db 也能跑
      - run: npm test

  frontend:
    name: 前端 · 单测与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build
